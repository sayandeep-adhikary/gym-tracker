<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <title>Offline · Gym Tracker</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(60rem 60rem at 15% -20%, rgba(59, 130, 246, 0.12), transparent 55%),
          #0a0d14;
        color: #f5f7fa;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      .mark {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        background: #3b82f6;
        box-shadow: 0 0 40px -8px rgba(59, 130, 246, 0.6);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 1.75rem;
        color: #9aa5b8;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.95rem;
        color: #fff;
        background: #3b82f6;
        transition: transform 0.15s ease;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <g stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 24v16" />
            <path d="M15 28v8" />
            <path d="M42 24v16" />
            <path d="M49 28v8" />
            <path d="M22 32h20" />
          </g>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Reconnect to the internet to keep training. Your saved workouts and
        progress are safe on this device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
